<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-label="Decision tree for shrinking the KV cache, and what each level of change costs">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="decide-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="decide-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="decide-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="decide-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="decide-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<rect x="95" y="14" width="190" height="34" rx="7" class="n"/>
<text x="190" y="35.5" text-anchor="middle" class="b">long-context LLM</text>
<path d="M190,48 L190,62" class="w-i" marker-end="url(#decide-ai)"/>
<polygon points="108,88 190,64 272,88 190,112" class="n"/>
<text x="190" y="92.5" text-anchor="middle" class="sm">KV too large?</text>
<path d="M272,88 L318,88" class="w-i" marker-end="url(#decide-ai)"/>
<text x="286" y="82" class="xs">no</text>
<rect x="320" y="72" width="180" height="32" rx="7" class="n-p"/>
<text x="410" y="92.5" text-anchor="middle" class="xs">keep MHA / GQA</text>
<path d="M190,112 L190,142" class="w-i" marker-end="url(#decide-ai)"/>
<text x="198" y="132" class="xs">yes</text>
<rect x="85" y="144" width="210" height="34" rx="7" class="n-s"/>
<text x="190" y="165.5" text-anchor="middle" class="sm b">GQA / MQA  (H_kv)</text>
<path d="M190,178 L190,192" class="w-i" marker-end="url(#decide-ai)"/>
<polygon points="108,218 190,194 272,218 190,242" class="n"/>
<text x="190" y="222.5" text-anchor="middle" class="sm">still too large?</text>
<path d="M272,218 L318,218" class="w-i" marker-end="url(#decide-ai)"/>
<text x="286" y="212" class="xs">no</text>
<rect x="320" y="202" width="180" height="32" rx="7" class="n-p"/>
<text x="410" y="222.5" text-anchor="middle" class="xs">stop: GQA is enough</text>
<path d="M190,242 L190,272" class="w-i" marker-end="url(#decide-ai)"/>
<text x="198" y="262" class="xs">yes</text>
<rect x="85" y="274" width="210" height="34" rx="7" class="n-m"/>
<text x="190" y="295.5" text-anchor="middle" class="sm b">MLA  (H_kv·d_h)</text>
<path d="M190,308 L190,322" class="w-i" marker-end="url(#decide-ai)"/>
<polygon points="108,348 190,324 272,348 190,372" class="n"/>
<text x="190" y="352.5" text-anchor="middle" class="sm">still too large?</text>
<path d="M272,348 L318,348" class="w-i" marker-end="url(#decide-ai)"/>
<text x="286" y="342" class="xs">no</text>
<rect x="320" y="332" width="180" height="32" rx="7" class="n-p"/>
<text x="410" y="352.5" text-anchor="middle" class="xs">stop: MLA is enough</text>
<path d="M190,372 L190,402" class="w-i" marker-end="url(#decide-ai)"/>
<text x="198" y="392" class="xs">yes</text>
<rect x="85" y="404" width="210" height="34" rx="7" class="n-m"/>
<text x="190" y="425.5" text-anchor="middle" class="sm b">KV quant (S) · window (T)</text>
<path d="M190,438 L190,452" class="w-i" marker-end="url(#decide-ai)"/>
<polygon points="108,478 190,454 272,478 190,502" class="n"/>
<text x="190" y="482.5" text-anchor="middle" class="sm">still too large?</text>
<path d="M272,478 L318,478" class="w-i" marker-end="url(#decide-ai)"/>
<text x="286" y="472" class="xs">no</text>
<rect x="320" y="462" width="180" height="32" rx="7" class="n-p"/>
<text x="410" y="482.5" text-anchor="middle" class="xs">stop: design is enough</text>
<path d="M190,502 L190,532" class="w-i" marker-end="url(#decide-ai)"/>
<text x="198" y="522" class="xs">yes</text>
<rect x="85" y="534" width="210" height="34" rx="7" class="n-s"/>
<text x="190" y="555.5" text-anchor="middle" class="sm b">CLA / YOCO  (L)</text>
<path d="M190,568 L190,582" class="w-i" marker-end="url(#decide-ai)"/>
<polygon points="108,608 190,584 272,608 190,632" class="n"/>
<text x="190" y="612.5" text-anchor="middle" class="sm">still too large?</text>
<path d="M272,608 L318,608" class="w-i" marker-end="url(#decide-ai)"/>
<text x="286" y="602" class="xs">no</text>
<rect x="320" y="592" width="180" height="32" rx="7" class="n-p"/>
<text x="410" y="612.5" text-anchor="middle" class="xs">stop: design is enough</text>
<path d="M190,632 L190,662" class="w-i" marker-end="url(#decide-ai)"/>
<text x="198" y="652" class="xs">yes</text>
<rect x="85" y="664" width="210" height="34" rx="7" class="n-c"/>
<text x="190" y="685.5" text-anchor="middle" class="sm b">hybrid SSM / attention</text>
<text x="560" y="26" class="hd">What does adoption cost?</text>
<rect x="560" y="42" width="420" height="70" rx="7" class="n-c"/>
<text x="574" y="64" class="sm b">LEVEL 1 · serving, no retraining</text>
<rect x="900" y="54" width="18" height="10" rx="2" class="n-x"/>
<rect x="924" y="54" width="18" height="10" rx="2" class="n"/>
<rect x="948" y="54" width="18" height="10" rx="2" class="n"/>
<text x="574" y="84" class="xs">PagedAttention, FlashAttention, KV quantization,</text>
<text x="574" y="99" class="xs">continuous batching, prefix caching</text>
<rect x="560" y="126" width="420" height="85" rx="7" class="n-s"/>
<text x="574" y="148" class="sm b">LEVEL 2 · architecture, uptrain</text>
<rect x="900" y="138" width="18" height="10" rx="2" class="n-x"/>
<rect x="924" y="138" width="18" height="10" rx="2" class="n-x"/>
<rect x="948" y="138" width="18" height="10" rx="2" class="n"/>
<text x="574" y="168" class="xs">MHA → GQA: mean-pool K, V per group, uptrain ~5%</text>
<text x="574" y="183" class="xs">MHA → MLA: joint SVD + partial RoPE</text>
<text x="574" y="198" class="xs">(Llama-2-7B: −92% KV, ~0.5% LongBench drop)</text>
<rect x="560" y="225" width="420" height="70" rx="7" class="n-x"/>
<text x="574" y="247" class="sm b">LEVEL 3 · a new model</text>
<rect x="900" y="237" width="18" height="10" rx="2" class="n-x"/>
<rect x="924" y="237" width="18" height="10" rx="2" class="n-x"/>
<rect x="948" y="237" width="18" height="10" rx="2" class="n-x"/>
<text x="574" y="267" class="xs">Transformer → hybrid attention / SSM,</text>
<text x="574" y="282" class="xs">cross-layer sharing: new computation graph</text>
<text x="560" y="317" class="xs">Start at level 1. Go to level 2 when KV does not fit;</text>
<text x="560" y="332" class="xs">level 3 only when you train a new model.</text>
<text x="560" y="369" class="sm b">Decode still slow? Compare arithmetic intensity</text>
<text x="560" y="385" class="xs">AI = FLOPs ÷ bytes with the ridge (A100 ≈ 200 FLOP/B)</text>
<rect x="560" y="401" width="200" height="78" rx="7" class="n-m"/>
<text x="660" y="444.5" text-anchor="middle" class="b"></text>
<text x="574" y="421" class="xs">memory-bound (AI &lt; ridge)</text>
<text x="574" y="436" class="xs">GQA/MQA, KV quant,</text>
<text x="574" y="451" class="xs">paged KV, FlashAttention</text>
<rect x="780" y="401" width="200" height="78" rx="7" class="n-c"/>
<text x="880" y="444.5" text-anchor="middle" class="b"></text>
<text x="794" y="421" class="xs">compute-bound (AI &gt; ridge)</text>
<text x="794" y="436" class="xs">Tensor Cores, lower</text>
<text x="794" y="451" class="xs">precision, fewer FLOPs</text>
<text x="560" y="501" class="xs">GQA decode AI ≈ H_q / H_kv (4 for GQA-8): memory-bound.</text>
<text x="560" y="516" class="xs">MLA absorbed decode ≈ 242 FLOP/B: near the ridge.</text>
</svg>
