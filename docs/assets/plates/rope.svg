<text x="656" y="42.6025" text-anchor="end" class="xs b">base 500,000 (Llama-3): up to 2,559,196</text>
<path d="M340,127.008 L660,127.008" class="w-x dash"/>
<text x="346" y="121.008" class="xs f-x">8,192 = trained context</text>
<text x="500" y="268" text-anchor="middle" class="xs">pair index i = 0 … 63 (d_h = 128)</text>
<text x="340" y="22" class="xs b">wavelength λ_i = 2π · base^(2i/d_h), tokens (log)</text>
<text x="340" y="290" class="xs">pairs above the red line never finished a turn</text>
<text x="340" y="305" class="xs">in training: PI, NTK and YaRN rescale their θ_i.</text>
<text x="700" y="22" class="xs b">how RoPE meets the KV cache</text>
<rect x="700" y="34" width="130" height="28" rx="7" class="n-m"/>
<text x="765" y="52.5" text-anchor="middle" class="xs b">R_0 k_0</text>
<rect x="700" y="68" width="130" height="28" rx="7" class="n-m"/>
<text x="765" y="86.5" text-anchor="middle" class="xs b">R_1 k_1</text>
<rect x="700" y="102" width="130" height="28" rx="7" class="n-m"/>
<text x="765" y="120.5" text-anchor="middle" class="xs b">R_2 k_2</text>
<rect x="700" y="136" width="130" height="28" rx="7" class="n-m"/>
<text x="765" y="154.5" text-anchor="middle" class="xs b">…</text>
<rect x="700" y="170" width="130" height="28" rx="7" class="n-m"/>
<text x="765" y="188.5" text-anchor="middle" class="xs b">R_t-1 k</text>
<rect x="850" y="170" width="130" height="28" rx="7" class="n-c"/>
<text x="915" y="188.5" text-anchor="middle" class="xs b">R_t q_t (new)</text>
<path d="M848,184 L832,184" class="w-c" marker-end="url(#rope-ac)"/>
<text x="700" y="222" class="xs">keys are cached ALREADY rotated at</text>
<text x="700" y="237" class="xs">their absolute position n; only the</text>
<text x="700" y="252" class="xs">new query rotates. V is never rotated.</text>
<text x="700" y="267" class="xs">Anything that renumbers positions</text>
<text x="700" y="282" class="xs">(windows, θ changes, MLA absorption)</text>
<text x="700" y="297" class="xs">needs pre-RoPE K or a re-rotation.</text>
</svg>
