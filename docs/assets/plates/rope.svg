<text x="202" y="100" class="xs b f-x">m·θ_i</text>
<text x="20" y="22" class="xs b">one pair (x_2i, x_2i+1) of q or k</text>
<text x="20" y="268" class="xs">rotation keeps |x|; position lives in the angle</text>
<text x="20" y="284" class="sm b">⟨R_m q, R_n k⟩ = ⟨q, R_(n−m) k⟩</text>
