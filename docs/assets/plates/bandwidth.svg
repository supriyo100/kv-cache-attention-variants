<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-label="Per decode step, weights plus the whole KV cache are read from HBM">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="bandwidth-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="bandwidth-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="bandwidth-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="bandwidth-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="bandwidth-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<text x="20" y="16" class="xs">B = 4 chats × 8K tokens  ·  A100-40GB, 1.555 TB/s  ·  step time ≥ bytes ÷ bandwidth  (theoretical lower bound)</text>
<text x="20" y="64" class="hd">MHA</text>
<text x="20" y="80" class="xs">KV 17.18 GB</text>
<rect x="210" y="50" width="240.086" height="30" rx="3" class="n-p"/>
<text x="218" y="69" class="xs">weights 9.0 ms</text>
<rect x="450.086" y="50" width="294.617" height="30" rx="3" class="n-mm"/>
<text x="458.086" y="69" class="xs b">KV 11.05 ms</text>
<text x="756.703" y="64" class="sm b">≥ 20.1 ms</text>
<text x="756.703" y="79" class="xs">≈ 50 tokens/s per chat</text>
<text x="20" y="114" class="hd">GQA-8</text>
<text x="20" y="130" class="xs">KV 4.29 GB</text>
<rect x="210" y="100" width="240.086" height="30" rx="3" class="n-p"/>
<text x="218" y="119" class="xs">weights 9.0 ms</text>
<rect x="450.086" y="100" width="73.6543" height="30" rx="3" class="n-m"/>
<text x="458.086" y="119" class="xs b">KV 2.76 ms</text>
<text x="535.74" y="114" class="sm b">≥ 11.8 ms</text>
<text x="535.74" y="129" class="xs">≈ 85 tokens/s per chat</text>
<text x="20" y="164" class="hd">MLA</text>
<text x="20" y="180" class="xs">KV 1.21 GB</text>
<rect x="210" y="150" width="240.086" height="30" rx="3" class="n-p"/>
<text x="218" y="169" class="xs">weights 9.0 ms</text>
<rect x="450.086" y="150" width="20.7153" height="30" rx="3" class="n-m"/>
<text x="482.801" y="164" class="sm b">≥ 9.8 ms</text>
<text x="482.801" y="179" class="xs">≈ 102 tokens/s per chat  (KV 0.78 ms)</text>
<text x="20" y="214" class="hd">MQA</text>
<text x="20" y="230" class="xs">KV 0.54 GB</text>
<rect x="210" y="200" width="240.086" height="30" rx="3" class="n-p"/>
<text x="218" y="219" class="xs">weights 9.0 ms</text>
<rect x="450.086" y="200" width="9.20679" height="30" rx="3" class="n-m"/>
<text x="471.293" y="214" class="sm b">≥ 9.3 ms</text>
<text x="471.293" y="229" class="xs">≈ 107 tokens/s per chat  (KV 0.35 ms)</text>
<path d="M450.086,40 L450.086,246" class="w-i dash"/>
<text x="450.086" y="36" text-anchor="middle" class="xs">weights alone</text>
<text x="20" y="272" class="xs">With MHA the KV read (11.0 ms) exceeds the weight read (9.0 ms). After GQA-8 or MLA, the weights dominate again.</text>
<text x="20" y="290" class="xs">Bytes per step scale with the cache: shrinking KV 4× or 14× shrinks this read by the same factor.</text>
</svg>
