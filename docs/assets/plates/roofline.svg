<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-label="Roofline: attainable TFLOPS = min(peak, AI × bandwidth), on an A100 and an H100">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="roofline-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="roofline-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="roofline-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="roofline-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="roofline-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<path d="M70,24 L70,310 L600,310" class="w-i"/>
<path d="M112.229,310 L112.229,315" class="w-i"/>
<text x="112.229" y="328" text-anchor="middle" class="xs">1</text>
<path d="M252.509,310 L252.509,315" class="w-i"/>
<text x="252.509" y="328" text-anchor="middle" class="xs">10</text>
<path d="M392.789,310 L392.789,315" class="w-i"/>
<text x="392.789" y="328" text-anchor="middle" class="xs">100</text>
<path d="M533.069,310 L533.069,315" class="w-i"/>
<text x="533.069" y="328" text-anchor="middle" class="xs">1,000</text>
<text x="62" y="314" text-anchor="end" class="xs">1</text>
<text x="62" y="224.625" text-anchor="end" class="xs">10</text>
<text x="62" y="135.25" text-anchor="end" class="xs">100</text>
<text x="62" y="45.875" text-anchor="end" class="xs">1,000</text>
<text x="335" y="346" text-anchor="middle" class="xs">arithmetic intensity AI = FLOPs ÷ bytes (log)</text>
<text x="26" y="167.0" class="xs" text-anchor="middle" transform="rotate(-90 26 167.0)">attainable TFLOPS (log)</text>
<path d="M70,289.979 L458.742,42.3043 L600,42.3043" class="w-i dash"/>
<text x="596" y="36.3043" text-anchor="end" class="xs b">H100 989 TFLOPS · ridge ≈ 295</text>
<path d="M70,319.769 L435.213,87.0849 L600,87.0849" class="w-c"/>
<text x="596" y="81.0849" text-anchor="end" class="xs b">A100 312 TFLOPS · ridge ≈ 201</text>
<circle cx="112.229" cy="292.864" r="5" class="n-m"/>
<text x="120.229" y="284.864" class="xs b">MHA decode attn: 1.55</text>
<circle cx="196.686" cy="239.055" r="5" class="n-m"/>
<text x="204.686" y="255.055" class="xs b">GQA-8 decode attn: 6.22</text>
<circle cx="323.371" cy="158.341" r="5" class="n-m"/>
<text x="331.371" y="174.341" class="xs b">MQA decode attn: 49.8</text>
<circle cx="407.829" cy="104.532" r="5" class="n-m"/>
<text x="399.829" y="94.5322" text-anchor="end" class="xs b">weight GEMV, B = 128: 199</text>
<circle cx="490.841" cy="87.0849" r="5" class="n-c"/>
<text x="498.841" y="109.085" class="xs b">prefill GEMM: 312</text>
<text x="123.336" y="77.4409" class="xs b f-m">← memory-bound</text>
<text x="448.612" y="213.548" class="xs b f-c">compute-bound →</text>
<rect x="640" y="24" width="340" height="75" rx="6" class="n-m"/>
<text x="654" y="44" class="xs b">Decode attention: AI = H_q / H_kv</text>
<text x="654" y="62" class="xs">MHA 1, GQA-8 4, MQA 32: all far</text>
<text x="654" y="77" class="xs">below the ridge (~200). GQA&#x27;s win</text>
<text x="654" y="92" class="xs">is fewer bytes, not a new regime.</text>
<rect x="640" y="111" width="340" height="75" rx="6" class="n-c"/>
<text x="654" y="131" class="xs b">Weight GEMV: AI = batch size</text>
<text x="654" y="149" class="xs">batching reuses each weight read;</text>
<text x="654" y="164" class="xs">B ≈ 200 reaches the A100 ridge.</text>
<text x="654" y="179" class="xs">KV capacity caps B first.</text>
<rect x="640" y="198" width="340" height="75" rx="6" class="n"/>
<text x="654" y="218" class="xs b">Newer GPUs: the ridge rises</text>
<text x="654" y="236" class="xs">H100 adds FLOPs faster than</text>
<text x="654" y="251" class="xs">bandwidth (ridge ≈ 295), so decode</text>
<text x="654" y="266" class="xs">gets MORE memory-bound.</text>
<text x="640" y="299" class="sm b">Rule: AI &lt; ridge → cut bytes.</text>
<text x="640" y="317" class="sm b">AI &gt; ridge → cut or speed up FLOPs.</text>
</svg>
