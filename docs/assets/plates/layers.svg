<text x="80" y="110.5" text-anchor="middle" class="sm">L2 attention</text>
<rect x="152" y="92" width="90" height="28" rx="7" class="n-m"/>
<text x="197" y="110.5" text-anchor="middle" class="sm b">KV</text>
