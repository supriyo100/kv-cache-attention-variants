<text x="80" y="182.5" text-anchor="middle" class="sm">L4 attention</text>
<rect x="152" y="164" width="90" height="28" rx="7" class="n-m"/>
<text x="197" y="182.5" text-anchor="middle" class="sm b">KV</text>
