<path d="M630,178 L687,178 L687,155" class="w-s dash" marker-end="url(#layers-as)"/>
<rect x="510" y="200" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="218.5" text-anchor="middle" class="sm">L5 attention</text>
<rect x="642" y="200" width="90" height="28" rx="7" class="n-m"/>
<text x="687" y="218.5" text-anchor="middle" class="sm b">KV3</text>
<rect x="510" y="236" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="254.5" text-anchor="middle" class="sm">L6 reuses KV3</text>
<path d="M630,250 L687,250 L687,227" class="w-s dash" marker-end="url(#layers-as)"/>
<rect x="510" y="272" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="290.5" text-anchor="middle" class="sm">L7 attention</text>
<rect x="642" y="272" width="90" height="28" rx="7" class="n-m"/>
<text x="687" y="290.5" text-anchor="middle" class="sm b">KV4</text>
<rect x="510" y="308" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="326.5" text-anchor="middle" class="sm">L8 reuses KV4</text>
<path d="M630,322 L687,322 L687,299" class="w-s dash" marker-end="url(#layers-as)"/>
<text x="755" y="22" class="hd">D · YOCO</text>
<text x="755" y="40" class="xs">cache one global KV</text>
<rect x="755" y="56" width="120" height="28" rx="7" class="n-c"/>
<text x="815" y="74.5" text-anchor="middle" class="sm">L1 self-dec</text>
<rect x="887" y="64" width="16" height="12" rx="2" class="n-c"/>
<rect x="755" y="92" width="120" height="28" rx="7" class="n-c"/>
<text x="815" y="110.5" text-anchor="middle" class="sm">L2 self-dec</text>
<rect x="887" y="100" width="16" height="12" rx="2" class="n-c"/>
<rect x="755" y="128" width="120" height="28" rx="7" class="n-c"/>
<text x="815" y="146.5" text-anchor="middle" class="sm">L3 self-dec</text>
<rect x="887" y="136" width="16" height="12" rx="2" class="n-c"/>
<rect x="755" y="164" width="120" height="28" rx="7" class="n-c"/>
