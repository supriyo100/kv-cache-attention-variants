<path d="M875,322 L903,322" class="w-s" marker-end="url(#layers-as)"/>
<rect x="905" y="200" width="72" height="136" rx="7" class="n-m"/>
<circle cx="913" cy="208" r="2.6" class="f-m"/>
<text x="941" y="266" text-anchor="middle" class="b">global</text>
<text x="941" y="281" text-anchor="middle" class="xs">KV</text>
<path d="M941,192 L941,198" class="w-m" marker-end="url(#layers-am)"/>
<text x="911" y="74" class="xs">small</text>
<text x="911" y="87" class="xs">fixed cache</text>
<path d="M20,350 L245,350" class="rule"/>
<text x="20" y="368" class="sm b">8 layers → 8 KV copies</text>
<text x="20" y="384" class="xs">GQA/MQA thin each copy,</text>
<text x="20" y="398" class="xs">never make fewer</text>
<path d="M265,350 L490,350" class="rule"/>
<text x="265" y="368" class="sm b">8 copies, ~14× thinner</text>
<text x="265" y="384" class="xs">shrinks the width,</text>
<text x="265" y="398" class="xs">not the layer count</text>
<path d="M510,350 L735,350" class="rule"/>
<text x="510" y="368" class="sm b">8 layers → 4 copies (2×)</text>
<text x="510" y="384" class="xs">arXiv 2405.12981:</text>
<text x="510" y="398" class="xs">~2× vs MQA, near-equal acc.</text>
<path d="M755,350 L980,350" class="rule"/>
<text x="755" y="368" class="sm b">1 global KV + tiny caches</text>
<text x="755" y="384" class="xs">arXiv 2405.05254:</text>
<text x="755" y="398" class="xs">You Only Cache Once</text>
</svg>
