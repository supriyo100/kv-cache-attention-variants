<rect x="265" y="164" width="120" height="28" rx="7" class="n-c"/>
<text x="325" y="182.5" text-anchor="middle" class="sm">L4 attn (MLA)</text>
<rect x="397" y="170" width="18" height="16" rx="2" class="n-s"/>
