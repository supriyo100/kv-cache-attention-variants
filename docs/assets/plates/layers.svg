<rect x="397" y="314" width="18" height="16" rx="2" class="n-s"/>
<text x="423" y="326" class="xs">576</text>
<text x="510" y="22" class="hd">C · CLA</text>
<text x="510" y="40" class="xs">adjacent layers share one KV</text>
<rect x="510" y="56" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="74.5" text-anchor="middle" class="sm">L1 attention</text>
<rect x="642" y="56" width="90" height="28" rx="7" class="n-m"/>
<text x="687" y="74.5" text-anchor="middle" class="sm b">KV1</text>
<rect x="510" y="92" width="120" height="28" rx="7" class="n-c"/>
<text x="570" y="110.5" text-anchor="middle" class="sm">L2 reuses KV1</text>
<path d="M630,106 L687,106 L687,83" class="w-s dash" marker-end="url(#layers-as)"/>
<rect x="510" y="128" width="120" height="28" rx="7" class="n-c"/>
