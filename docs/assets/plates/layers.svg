<rect x="152" y="308" width="90" height="28" rx="7" class="n-m"/>
<text x="197" y="326.5" text-anchor="middle" class="sm b">KV</text>
<text x="265" y="22" class="hd">B · MLA</text>
<text x="265" y="40" class="xs">every layer owns a thin latent</text>
<rect x="265" y="56" width="120" height="28" rx="7" class="n-c"/>
<text x="325" y="74.5" text-anchor="middle" class="sm">L1 attn (MLA)</text>
