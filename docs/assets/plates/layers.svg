<rect x="397" y="206" width="18" height="16" rx="2" class="n-s"/>
<text x="423" y="218" class="xs">576</text>
<rect x="265" y="236" width="120" height="28" rx="7" class="n-c"/>
<text x="325" y="254.5" text-anchor="middle" class="sm">L6 attn (MLA)</text>
<rect x="397" y="242" width="18" height="16" rx="2" class="n-s"/>
<text x="423" y="254" class="xs">576</text>
<rect x="265" y="272" width="120" height="28" rx="7" class="n-c"/>
<text x="325" y="290.5" text-anchor="middle" class="sm">L7 attn (MLA)</text>
<rect x="397" y="278" width="18" height="16" rx="2" class="n-s"/>
<text x="423" y="290" class="xs">576</text>
<rect x="265" y="308" width="120" height="28" rx="7" class="n-c"/>
