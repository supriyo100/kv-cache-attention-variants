<rect x="887" y="172" width="16" height="12" rx="2" class="n-c"/>
<rect x="755" y="200" width="120" height="28" rx="7" class="n-c"/>
<text x="815" y="218.5" text-anchor="middle" class="sm">L5 cross-dec</text>
<path d="M875,214 L903,214" class="w-s" marker-end="url(#layers-as)"/>
<rect x="755" y="236" width="120" height="28" rx="7" class="n-c"/>
