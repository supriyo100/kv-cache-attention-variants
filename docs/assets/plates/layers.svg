<rect x="152" y="200" width="90" height="28" rx="7" class="n-m"/>
<text x="197" y="218.5" text-anchor="middle" class="sm b">KV</text>
<rect x="20" y="236" width="120" height="28" rx="7" class="n-c"/>
<text x="80" y="254.5" text-anchor="middle" class="sm">L6 attention</text>
