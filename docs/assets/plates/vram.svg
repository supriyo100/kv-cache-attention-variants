<text x="20" y="132" class="xs f-x">Common mistake: 40 − 14 GB of weights = 26 GB of KV. Reserve ~4–6 GB for everything that is neither.</text>
<text x="20" y="166" class="sm b">B_max = floor( (VRAM − weights − overhead) ÷ KV per sequence )   with a 22 GB KV pool (40 − 14 − 4):</text>
