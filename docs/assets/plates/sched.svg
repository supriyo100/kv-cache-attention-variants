<rect x="668" y="212" width="158" height="18" rx="3" class="n-s"/>
<text x="674" y="225" class="xs b">G</text>
<rect x="828" y="212" width="110" height="18" rx="3" class="n-s"/>
<text x="834" y="225" class="xs b">I</text>
<rect x="540" y="238" width="198" height="18" rx="3" class="n-s"/>
<text x="546" y="251" class="xs b">B</text>
<rect x="740" y="238" width="198" height="18" rx="3" class="n-s"/>
<text x="746" y="251" class="xs b">F</text>
<rect x="540" y="264" width="18" height="18" rx="3" class="n-s"/>
<text x="546" y="277" class="xs b">C</text>
<rect x="560" y="264" width="238" height="18" rx="3" class="n-s"/>
<text x="566" y="277" class="xs b">H</text>
<rect x="800" y="264" width="138" height="18" rx="3" class="n-s"/>
<text x="806" y="277" class="xs b">J</text>
<rect x="540" y="290" width="398" height="18" rx="3" class="n-s"/>
<text x="546" y="303" class="xs b">D</text>
<text x="540" y="334" class="xs b f-c">continuous: a finished slot is refilled the next iteration</text>
<text x="540" y="350" class="xs">(E … J illustrative; needs per-iteration alloc/free = paged KV)</text>
</svg>
