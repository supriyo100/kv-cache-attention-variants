<path d="M234,60 L250,60" class="w-i" marker-end="url(#sched-ai)"/>
<path d="M364,60 L380,60" class="w-i" marker-end="url(#sched-ai)"/>
<path d="M480,60 L496,60" class="w-i" marker-end="url(#sched-ai)"/>
<path d="M596,60 L612,60" class="w-i" marker-end="url(#sched-ai)"/>
<path d="M726,60 L742,60" class="w-i" marker-end="url(#sched-ai)"/>
<path d="M856,60 L872,60" class="w-i" marker-end="url(#sched-ai)"/>
<text x="308" y="104" text-anchor="middle" class="xs f-s">hit: reuse blocks</text>
<text x="308" y="118" text-anchor="middle" class="xs">miss: allocate</text>
<text x="670" y="104" text-anchor="middle" class="xs f-m">yes: append 1 block</text>
