<text x="677" y="150" text-anchor="middle" class="xs">no: next iteration (every running request, one token each)</text>
<text x="20" y="196" class="xs b">Static vs continuous batching · A = 20, B = 500, C = 50, D = 1,000 tokens (linear scale)</text>
<text x="20" y="226" class="xs b">A</text>
<rect x="40" y="212" width="8" height="18" rx="3" class="n-s"/>
<rect x="48" y="212" width="392" height="18" rx="3" class="n-x" opacity="0.55"/>
<text x="20" y="252" class="xs b">B</text>
