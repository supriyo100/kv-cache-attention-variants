<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Prefix sharing: hash-chained blocks, reference counts and copy-on-write">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="share-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="share-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="share-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="share-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="share-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<text x="20" y="18" class="xs b">1,000 users share one 2,000-token system prompt (block 16 tokens, 2 MiB per block on Llama-3-8B)</text>
<rect x="20" y="32" width="104" height="30" rx="7" class="n-s"/>
<text x="72" y="51.5" text-anchor="middle" class="xs b">b0</text>
<text x="72" y="80" text-anchor="middle" class="xs">h0 = H(∅, b0)</text>
<path d="M124,47 L136,47" class="w-s" marker-end="url(#share-as)"/>
<rect x="138" y="32" width="104" height="30" rx="7" class="n-s"/>
<text x="190" y="51.5" text-anchor="middle" class="xs b">b1</text>
<text x="190" y="80" text-anchor="middle" class="xs">h1 = H(h0, b1)</text>
<path d="M242,47 L254,47" class="w-s" marker-end="url(#share-as)"/>
<rect x="256" y="32" width="104" height="30" rx="7" class="n-s"/>
<text x="308" y="51.5" text-anchor="middle" class="xs b">b2</text>
<text x="308" y="80" text-anchor="middle" class="xs">h2 = H(h1, b2)</text>
<path d="M360,47 L372,47" class="w-s" marker-end="url(#share-as)"/>
<rect x="374" y="32" width="104" height="30" rx="7" class="n-s"/>
<text x="426" y="51.5" text-anchor="middle" class="xs b">…</text>
<text x="426" y="80" text-anchor="middle" class="xs">…</text>
<path d="M478,47 L490,47" class="w-s" marker-end="url(#share-as)"/>
<rect x="492" y="32" width="104" height="30" rx="7" class="n-s"/>
<text x="544" y="51.5" text-anchor="middle" class="xs b">b124</text>
<text x="544" y="80" text-anchor="middle" class="xs">h124 = H(h123, b124)</text>
<text x="20" y="112" class="xs">no sharing: 1,000 × 125 blocks × 2 MiB = 250,000 MiB ≈ 244 GiB of identical K/V</text>
<text x="20" y="129" class="xs">shared:     125 blocks × 2 MiB = 250 MiB once, refcount = 1,000 (+ small private tails)</text>
<text x="20" y="146" class="xs">prefill:    users 2 … 1,000 skip the 2,000 shared tokens: TTFT covers only their own suffix</text>
<text x="20" y="178" class="xs f-x">One changed token early (say, a timestamp) breaks the chain for every later block.</text>
<text x="20" y="214" class="xs b">refcount of a shared block over time</text>
<rect x="20" y="226" width="112" height="40" rx="7" class="n-s"/>
<text x="76" y="250.5" text-anchor="middle" class="xs b">refcount 3</text>
<text x="76" y="284" text-anchor="middle" class="xs">A, B, C share it</text>
<path d="M132,246 L150,246" class="w-i" marker-end="url(#share-ai)"/>
<rect x="152" y="226" width="112" height="40" rx="7" class="n-s"/>
<text x="208" y="250.5" text-anchor="middle" class="xs b">refcount 2</text>
<text x="208" y="284" text-anchor="middle" class="xs">A finishes</text>
<path d="M264,246 L282,246" class="w-i" marker-end="url(#share-ai)"/>
<rect x="284" y="226" width="112" height="40" rx="7" class="n-s"/>
<text x="340" y="250.5" text-anchor="middle" class="xs b">refcount 1</text>
<text x="340" y="284" text-anchor="middle" class="xs">B finishes</text>
<path d="M396,246 L414,246" class="w-i" marker-end="url(#share-ai)"/>
<rect x="416" y="226" width="112" height="40" rx="7" class="n"/>
<text x="472" y="250.5" text-anchor="middle" class="xs b">free (cached)</text>
<text x="472" y="284" text-anchor="middle" class="xs">C finishes</text>
<text x="570" y="214" class="xs b">copy-on-write rules</text>
<text x="570" y="238" class="xs b">fork / share</text>
<text x="740" y="238" class="xs">ref += 1</text>
<text x="570" y="260" class="xs b">write while ref &gt; 1</text>
<text x="740" y="260" class="xs">copy block, ref −= 1</text>
<text x="570" y="282" class="xs b">write while ref = 1</text>
<text x="740" y="282" class="xs">in place</text>
<text x="570" y="304" class="xs b">sequence freed</text>
<text x="740" y="304" class="xs">ref −= 1; at 0 → LRU pool</text>
</svg>
