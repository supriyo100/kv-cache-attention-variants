<rect x="873" y="206" width="27" height="30" rx="3" class="n"/>
<rect x="904" y="206" width="27" height="30" rx="3" class="n"/>
<rect x="935" y="206" width="27" height="30" rx="3" class="n"/>
<text x="36" y="268" class="xs f-m">written once by prefill</text>
<text x="284" y="268" class="xs f-m">appended by decode</text>
<text x="470" y="268" class="xs">future tokens: final length unknown at arrival</text>
<path d="M330,100 L330,204" class="w-m" marker-end="url(#pipeline-am)"/>
<text x="338" y="150" class="xs b f-m">writes K, V once</text>
<path d="M620,204 L620,102" class="w-m" marker-end="url(#pipeline-am)"/>
<text x="612" y="150" text-anchor="end" class="xs b f-m">reads ALL K, V every step</text>
<path d="M720,102 L720,160 L483,160 L483,204" class="w-s dash" marker-end="url(#pipeline-as)"/>
<text x="728" y="156" class="xs b f-s">append k_t, v_t</text>
<text x="20" y="302" class="xs">Without a cache, step t recomputes K and V for all t tokens: O(T²) work per sequence.</text>
<text x="20" y="318" class="xs b">With a cache, each step is O(T) reads. The price is memory, and every step re-reads all of it.</text>
</svg>
