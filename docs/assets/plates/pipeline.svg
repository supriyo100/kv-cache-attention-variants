<rect x="176" y="58" width="20" height="30" rx="3" class="n-p"/>
<rect x="200" y="58" width="20" height="30" rx="3" class="n-p"/>
<rect x="270" y="34" width="210" height="66" rx="7" class="n-c"/>
<circle cx="278" cy="42" r="2.6" class="f-c"/>
<text x="375" y="65" text-anchor="middle" class="b">PREFILL</text>
<text x="375" y="80" text-anchor="middle" class="xs">all prompt tokens at once</text>
<text x="375" y="118" text-anchor="middle" class="xs">compute-bound · sets TTFT</text>
<rect x="560" y="34" width="210" height="66" rx="7" class="n-s"/>
<circle cx="568" cy="42" r="2.6" class="f-s"/>
<text x="665" y="65" text-anchor="middle" class="b">DECODE</text>
<text x="665" y="80" text-anchor="middle" class="xs">one new token per step</text>
<text x="665" y="118" text-anchor="middle" class="xs">memory-bound · sets TPOT</text>
<path d="M230,67 L268,67" class="w-i" marker-end="url(#pipeline-ai)"/>
<path d="M480,67 L558,67" class="w-i" marker-end="url(#pipeline-ai)"/>
<rect x="810" y="50" width="38" height="34" rx="7" class="n-c"/>
<text x="829" y="71.5" text-anchor="middle" class="xs b">y1</text>
<rect x="854" y="50" width="38" height="34" rx="7" class="n-c"/>
<text x="873" y="71.5" text-anchor="middle" class="xs b">y2</text>
<rect x="898" y="50" width="38" height="34" rx="7" class="n-c"/>
<text x="917" y="71.5" text-anchor="middle" class="xs b">y3</text>
<rect x="942" y="50" width="38" height="34" rx="7" class="n-c"/>
<text x="961" y="71.5" text-anchor="middle" class="xs b">…</text>
<path d="M770,67 L808,67" class="w-c" marker-end="url(#pipeline-ac)"/>
<text x="810" y="40" class="xs b">output tokens</text>
<rect x="20" y="180" width="960" height="72" rx="10" class="grp-m"/>
<text x="30" y="195" class="xs b">KV cache of this request: one K and one V per token, per layer, per KV head</text>
<rect x="36" y="206" width="27" height="30" rx="3" class="n-m"/>
<rect x="67" y="206" width="27" height="30" rx="3" class="n-m"/>
