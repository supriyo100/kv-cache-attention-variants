<text x="480" y="18" class="xs b">physical pool</text>
<rect x="480" y="22" width="130" height="28" rx="7" class="n-m"/>
<text x="545" y="40.5" text-anchor="middle" class="xs b">P0 A:L1</text>
<rect x="480" y="58" width="130" height="28" rx="7" class="n"/>
<text x="545" y="76.5" text-anchor="middle" class="xs">P1 free</text>
<rect x="480" y="94" width="130" height="28" rx="7" class="n-m"/>
<text x="545" y="112.5" text-anchor="middle" class="xs b">P2 A:L0</text>
<rect x="480" y="130" width="130" height="28" rx="7" class="n-m"/>
<text x="545" y="148.5" text-anchor="middle" class="xs b">P3 A:L2</text>
<rect x="480" y="166" width="130" height="28" rx="7" class="n"/>
<text x="545" y="184.5" text-anchor="middle" class="xs">P4 free</text>
<rect x="480" y="202" width="130" height="28" rx="7" class="n-m"/>
<text x="545" y="220.5" text-anchor="middle" class="xs b">P5 B:L0</text>
<rect x="480" y="238" width="130" height="28" rx="7" class="n"/>
<text x="545" y="256.5" text-anchor="middle" class="xs">P6 free</text>
<rect x="480" y="274" width="130" height="28" rx="7" class="n-m"/>
<text x="545" y="292.5" text-anchor="middle" class="xs b">P7 B:L1</text>
<rect x="650" y="20" width="330" height="150" rx="7" class="n-p"/>
<text x="664" y="42" class="xs b">address translation (block_size 16)</text>
<text x="664" y="62" class="xs">token position p = 37</text>
<text x="664" y="80" class="xs">logical block j = p // 16 = 2</text>
<text x="664" y="98" class="xs">offset o = p % 16 = 5</text>
<text x="664" y="116" class="xs">block_table[2] = 3</text>
<text x="664" y="134" class="xs">physical slot = 3 · 16 + 5 = 53</text>
<text x="650" y="196" class="xs">Each sequence sees one contiguous space;</text>
<text x="650" y="212" class="xs">the table hides where the pieces live.</text>
<text x="650" y="228" class="xs">Only the LAST block can be partly empty:</text>
<text x="650" y="244" class="xs">waste ≤ block_size − 1 tokens per sequence.</text>
<text x="650" y="260" class="xs">Growth appends a table entry: O(1),</text>
<text x="650" y="276" class="xs">never an O(T) copy of the cache.</text>
</svg>
