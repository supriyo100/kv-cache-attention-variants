<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="Four ways the KV cache hurts: capacity, bandwidth, allocation, quality">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="problems-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="problems-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="problems-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="problems-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="problems-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<rect x="20" y="16" width="225" height="54" rx="7" class="n-m"/>
<text x="34" y="38" class="hd">CAPACITY</text>
<text x="34" y="57" class="xs">can it fit?</text>
<rect x="20" y="80" width="225" height="196" rx="7" class="n"/>
<text x="34" y="102" class="xs b f-i">WHY</text>
<text x="34" y="120" class="xs">KV grows with T and B</text>
<text x="34" y="135" class="xs">64 KiB/token × 100K = 6.55 GB</text>
<text x="34" y="150" class="xs">B = 4 → 26.2 GB: OOM</text>
<path d="M34,170 L231,170" class="rule"/>
<text x="34" y="192" class="xs b f-c">FIX</text>
<text x="34" y="210" class="xs">GQA/MLA, FP8 KV, admission</text>
<path d="M34,226 L231,226" class="rule"/>
<text x="34" y="248" class="xs b f-x">COST</text>
<text x="34" y="266" class="xs">concurrency, quality</text>
<rect x="265" y="16" width="225" height="54" rx="7" class="n-x"/>
<text x="279" y="38" class="hd">BANDWIDTH</text>
<text x="279" y="57" class="xs">can HBM feed the cores?</text>
<rect x="265" y="80" width="225" height="196" rx="7" class="n"/>
<text x="279" y="102" class="xs b f-i">WHY</text>
<text x="279" y="120" class="xs">every token re-reads all K/V</text>
<text x="279" y="135" class="xs">MHA 26.2 GB ÷ 1.555 TB/s</text>
<text x="279" y="150" class="xs">= 16.8 ms per token</text>
<path d="M279,170 L476,170" class="rule"/>
<text x="279" y="192" class="xs b f-c">FIX</text>
<text x="279" y="210" class="xs">fewer bytes: GQA, FP8, window</text>
<path d="M279,226 L476,226" class="rule"/>
<text x="279" y="248" class="xs b f-x">COST</text>
<text x="279" y="266" class="xs">information removed</text>
<rect x="510" y="16" width="225" height="54" rx="7" class="n-c"/>
<text x="524" y="38" class="hd">ALLOCATION</text>
<text x="524" y="57" class="xs">where do the bytes live?</text>
<rect x="510" y="80" width="225" height="196" rx="7" class="n"/>
<text x="524" y="102" class="xs b f-i">WHY</text>
<text x="524" y="120" class="xs">max_len slabs + holes:</text>
<text x="524" y="135" class="xs">only 20.4–38.2% held tokens</text>
<text x="524" y="150" class="xs">(vLLM paper, old systems)</text>
<path d="M524,170 L721,170" class="rule"/>
<text x="524" y="192" class="xs b f-c">FIX</text>
<text x="524" y="210" class="xs">paged blocks, prefix sharing</text>
<path d="M524,226 L721,226" class="rule"/>
<text x="524" y="248" class="xs b f-x">COST</text>
<text x="524" y="266" class="xs">block-table indirection</text>
<rect x="755" y="16" width="225" height="54" rx="7" class="n-s"/>
<text x="769" y="38" class="hd">QUALITY</text>
<text x="769" y="57" class="xs">can it still retrieve?</text>
<rect x="755" y="80" width="225" height="196" rx="7" class="n"/>
<text x="769" y="102" class="xs b f-i">WHY</text>
<text x="769" y="120" class="xs">each byte saved can drop</text>
<text x="769" y="135" class="xs">information; MQA: 32 heads</text>
<text x="769" y="150" class="xs">read one K/V</text>
<path d="M769,170 L966,170" class="rule"/>
<text x="769" y="192" class="xs b f-c">FIX</text>
<text x="769" y="210" class="xs">GQA, MLA, careful quant</text>
<path d="M769,226 L966,226" class="rule"/>
<text x="769" y="248" class="xs b f-x">COST</text>
<text x="769" y="266" class="xs">retraining, kernels</text>
<rect x="20" y="292" width="960" height="44" rx="7" class="n-p"/>
<text x="500" y="312" text-anchor="middle" class="sm b">The KV cache is capacity + bandwidth + latency + concurrency + scheduling + quality at once.</text>
<text x="500" y="328" text-anchor="middle" class="xs">Modern inference engineering controls how information moves through the memory hierarchy.</text>
</svg>
