<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="FlashAttention: stream K/V tiles through SRAM with an online softmax; never write T×T to HBM">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="flash-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="flash-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="flash-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="flash-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="flash-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<rect x="20" y="20" width="600" height="96" rx="10" class="grp"/>
<text x="30" y="35" class="xs b">HBM · large and slow (A100: 40 GB, 1.555 TB/s)</text>
<rect x="34" y="46" width="132" height="54" rx="7" class="n-c"/>
<text x="100" y="77.5" text-anchor="middle" class="xs b">Q  (T × d_h)</text>
<rect x="180" y="46" width="132" height="54" rx="7" class="n-m"/>
<text x="246" y="77.5" text-anchor="middle" class="xs b">K  (T × d_h)</text>
<rect x="326" y="46" width="132" height="54" rx="7" class="n-m"/>
<text x="392" y="77.5" text-anchor="middle" class="xs b">V  (T × d_h)</text>
<rect x="472" y="46" width="132" height="54" rx="7" class="n-c"/>
<text x="538" y="77.5" text-anchor="middle" class="xs b">O  (T × d_h)</text>
<rect x="20" y="160" width="600" height="96" rx="10" class="grp"/>
<text x="30" y="175" class="xs b">SRAM / registers · tiny and fast · the inner loop lives here</text>
<rect x="34" y="188" width="104" height="54" rx="7" class="n-c"/>
<text x="86" y="219.5" text-anchor="middle" class="xs b">Q_i  B_r×d</text>
<rect x="150" y="188" width="104" height="54" rx="7" class="n-m"/>
<text x="202" y="219.5" text-anchor="middle" class="xs b">K_j  B_c×d</text>
<rect x="266" y="188" width="104" height="54" rx="7" class="n-m"/>
<text x="318" y="219.5" text-anchor="middle" class="xs b">V_j  B_c×d</text>
<rect x="382" y="188" width="104" height="54" rx="7" class="n"/>
<text x="434" y="219.5" text-anchor="middle" class="xs b">S_ij  B_r×B_c</text>
<rect x="498" y="188" width="104" height="54" rx="7" class="n-s"/>
<text x="550" y="219.5" text-anchor="middle" class="xs b">m, l  O_i</text>
<path d="M100,100 L86,186" class="w-c" marker-end="url(#flash-ac)"/>
<text x="100" y="140" class="xs">load Q_i once</text>
<path d="M246,100 L202,186" class="w-m" marker-end="url(#flash-am)"/>
<path d="M392,100 L318,186" class="w-m" marker-end="url(#flash-am)"/>
<text x="320" y="140" text-anchor="middle" class="xs">stream K_j, V_j</text>
<path d="M560,186 L544,100" class="w-c" marker-end="url(#flash-ac)"/>
<text x="540" y="140" text-anchor="end" class="xs">write O_i once</text>
<text x="20" y="284" class="xs">Standard attention writes S = QKᵀ (T × T) to HBM: at T = 100,000 that is 20 GB per head per layer,</text>
<text x="20" y="300" class="xs">read back for the softmax and again for P·V. FlashAttention keeps S in SRAM: extra memory O(T), not O(T²).</text>
<text x="20" y="316" class="xs">The output is exact. It reduces HBM traffic but does not shrink the KV cache or decide where it lives.</text>
<rect x="650" y="20" width="330" height="236" rx="7" class="n-p"/>
<text x="664" y="42" class="xs b">online softmax, one row</text>
<text x="664" y="62" class="xs">m&#x27; = max(m, rowmax S_ij)</text>
<text x="664" y="79" class="xs">a  = exp(m − m&#x27;)</text>
<text x="664" y="96" class="xs">l  = a·l + Σ exp(S_ij − m&#x27;)</text>
<text x="664" y="113" class="xs">O  = a·O + exp(S_ij − m&#x27;)·V_j</text>
<text x="664" y="130" class="xs">end: O / l   (exact)</text>
<text x="664" y="160" class="xs b">worked: tile 1 scores [1, 3]</text>
<text x="664" y="178" class="xs">m = 3, l = e^-2 + 1 = 1.1353</text>
<text x="664" y="195" class="xs">tile 2 score [5] → m&#x27; = 5</text>
<text x="664" y="212" class="xs">l = 0.1353 · 1.1353 + 1 = 1.1537</text>
<text x="664" y="229" class="xs">direct: e^-4 + e^-2 + 1 = 1.1537 ✓</text>
</svg>
