<svg class="vsp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Schematic: quality against KV compression; MLA sits off the head-count curve">
<style>.vsp{font-family:var(--ie-font-mono,"IBM Plex Mono",ui-monospace,Consolas,monospace)} .vsp text{font-size:13px;fill:var(--ie-ink,#1c232b)} .vsp .sm{font-size:11.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .xs{font-size:10.5px;fill:var(--ie-ink-2,#4a5561)} .vsp .b{font-weight:600} .vsp .hd{font-family:var(--ie-font-ui,Archivo,"Helvetica Neue",Arial,sans-serif);font-size:15px;font-weight:700;fill:var(--ie-ink,#1c232b)} .vsp .lg{font-size:20px;font-weight:700} .vsp .n{fill:var(--ie-free,#fff);stroke:var(--ie-ink-2,#4a5561);stroke-width:1.2} .vsp .n-c{fill:var(--ie-compute-bg,#d9efec);stroke:var(--ie-compute,#0e7c72);stroke-width:1.3} .vsp .n-m{fill:var(--ie-memory-bg,#f6e8c8);stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .n-s{fill:var(--ie-shared-bg,#e5e1f8);stroke:var(--ie-shared,#5b47c9);stroke-width:1.3} .vsp .n-x{fill:var(--ie-waste-bg,#f6dade);stroke:var(--ie-waste,#b42b3e);stroke-width:1.3} .vsp .n-p{fill:var(--ie-paper-2,#eceee9);stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .n-mm{fill:var(--ie-memory,#b5790a);fill-opacity:.5;stroke:var(--ie-memory,#b5790a);stroke-width:1.3} .vsp .grp{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1;stroke-dasharray:5 4;opacity:.75} .vsp .grp-m{fill:var(--ie-memory,#b5790a);fill-opacity:.06;stroke:var(--ie-memory,#b5790a);stroke-width:1.2;stroke-dasharray:6 4} .vsp .w-i{fill:none;stroke:var(--ie-ink-2,#4a5561);stroke-width:1.3} .vsp .w-c{fill:none;stroke:var(--ie-compute,#0e7c72);stroke-width:1.4} .vsp .w-m{fill:none;stroke:var(--ie-memory,#b5790a);stroke-width:1.4} .vsp .w-s{fill:none;stroke:var(--ie-shared,#5b47c9);stroke-width:1.4} .vsp .w-x{fill:none;stroke:var(--ie-waste,#b42b3e);stroke-width:1.4} .vsp .dash{stroke-dasharray:4 3} .vsp .rule{fill:none;stroke:var(--ie-rule,#d5d9d3);stroke-width:1} .vsp .f-i{fill:var(--ie-ink-2,#4a5561)} .vsp .f-c{fill:var(--ie-compute,#0e7c72)} .vsp .f-m{fill:var(--ie-memory,#b5790a)} .vsp .f-s{fill:var(--ie-shared,#5b47c9)} .vsp .f-x{fill:var(--ie-waste,#b42b3e)}</style>
<defs><marker id="quality-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-i"/></marker><marker id="quality-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-c"/></marker><marker id="quality-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-m"/></marker><marker id="quality-as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-s"/></marker><marker id="quality-ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-x"/></marker></defs>
<path d="M80,34 L80,300 L600,300" class="w-i"/>
<path d="M80,300 L80,305" class="w-i"/>
<text x="80" y="318" text-anchor="middle" class="xs">1×</text>
<path d="M166.667,300 L166.667,305" class="w-i"/>
<text x="166.667" y="318" text-anchor="middle" class="xs">2×</text>
<path d="M253.333,300 L253.333,305" class="w-i"/>
<text x="253.333" y="318" text-anchor="middle" class="xs">4×</text>
<path d="M340,300 L340,305" class="w-i"/>
<text x="340" y="318" text-anchor="middle" class="xs">8×</text>
<path d="M426.667,300 L426.667,305" class="w-i"/>
<text x="426.667" y="318" text-anchor="middle" class="xs">16×</text>
<path d="M513.333,300 L513.333,305" class="w-i"/>
<text x="513.333" y="318" text-anchor="middle" class="xs">32×</text>
<path d="M600,300 L600,305" class="w-i"/>
<text x="600" y="318" text-anchor="middle" class="xs">64×</text>
<text x="340" y="336" text-anchor="middle" class="xs">KV compression vs MHA (log scale)</text>
<text x="66" y="167.0" class="xs" text-anchor="middle" transform="rotate(-90 66 167.0)">quality / K-V diversity</text>
<text x="90" y="40" class="xs b f-x">schematic, not measured</text>
<path d="M80,60.6 L166.667,71.24 L253.333,87.2 L340,124.44 L426.667,172.32 L513.333,230.84" class="w-s" stroke-linejoin="round"/>
<circle cx="80" cy="60.6" r="5" class="n-s"/>
<text x="88" y="78.6" class="xs b">MHA</text>
<circle cx="166.667" cy="71.24" r="5" class="n-s"/>
<text x="174.667" y="89.24" class="xs b">GQA-16</text>
<circle cx="253.333" cy="87.2" r="5" class="n-s"/>
<text x="261.333" y="105.2" class="xs b">GQA-8</text>
<circle cx="340" cy="124.44" r="5" class="n-s"/>
<text x="348" y="142.44" class="xs b">GQA-4</text>
<circle cx="513.333" cy="230.84" r="5" class="n-s"/>
<text x="521.333" y="248.84" class="xs b">MQA</text>
<path d="M411.94,158.184 L411.94,69.6" class="w-m dash" marker-end="url(#quality-am)"/>
<rect x="405.94" y="54.6" width="12" height="12" rx="2" class="n-m"/>
<text x="421.94" y="50.6" class="sm b f-m">MLA (14.2× here)</text>
<text x="421.94" y="65.6" class="xs">changes WHAT is cached</text>
<circle cx="253.333" cy="209.56" r="5" class="n-c"/>
<text x="244.333" y="213.56" text-anchor="end" class="xs b">hybrid (KV in 25% of layers)</text>
<text x="244.333" y="227.56" text-anchor="end" class="xs">weaker exact recall</text>
<rect x="640" y="30" width="340" height="75" rx="6" class="n-s"/>
<text x="654" y="50" class="sm b">GQA / MQA: one curve</text>
<text x="654" y="68" class="xs">fewer KV heads → fewer bytes,</text>
<text x="654" y="83" class="xs">less K/V diversity; MQA pays</text>
<text x="654" y="98" class="xs">the most quality.</text>
<rect x="640" y="119" width="340" height="90" rx="6" class="n-m"/>
<text x="654" y="139" class="sm b">MLA: off the curve</text>
<text x="654" y="157" class="xs">32 distinct per-head K/V views</text>
<text x="654" y="172" class="xs">from one 576-number latent.</text>
<text x="654" y="187" class="xs">Pays in FLOPs, a RoPE split</text>
<text x="654" y="202" class="xs">and retraining, not quality.</text>
<rect x="640" y="223" width="340" height="60" rx="6" class="n-c"/>
<text x="654" y="243" class="sm b">Hybrid: a different trade</text>
<text x="654" y="261" class="xs">swaps exact token retrieval</text>
<text x="654" y="276" class="xs">for a fixed-size state.</text>
</svg>
