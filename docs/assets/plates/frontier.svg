<text x="20" y="362" class="xs b">DeepSeek-V3 (671B, MLA) caches less per token than Llama-3-8B (GQA): 68.6 vs 128 KiB. Architecture beats size.</text>
<text x="20" y="380" class="xs">gpt-oss-120b: growing part only (18 full-attention layers); its window layers add a small fixed amount. Verify a model card before quoting.</text>
