<text x="20" y="84" class="xs f-x">E needs 6 cells. 8 are free, but the largest hole is 5: E is refused (external fragmentation).</text>
<text x="20" y="99" class="xs">Crimson = reserved for a max_len the request never reaches (internal fragmentation): 12 of 32 cells hold tokens.</text>
<text x="20" y="188" class="xs f-c">A 6, B 2, C 4, E 6 = 18 used, 14 free. Any free block works, so E fits.</text>
<text x="20" y="203" class="xs">Waste is only each sequence&#x27;s last partial block: under 4% in vLLM, vs 20.4–38.2% useful before.</text>
