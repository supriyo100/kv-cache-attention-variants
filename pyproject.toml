[project]
name = "kv-cache-variants"
version = "0.1.0"
description = "KV Cache & Attention Variants — Module 03 course codebase"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.11",
    "mypy>=1.15",
    "arxiv>=4.0.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_cache_variants", "src/inference_lab"]
