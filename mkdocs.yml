site_name: KV Cache & Attention Variants — Module 03
site_description: Zero-to-advanced course docs — Naive Decoding through PagedAttention/vLLM
docs_dir: docs
# Pages build as sessions/05_gqa.html (not sessions/05_gqa/), so relative paths in embedded
# HTML resolve exactly like in the source tree. See hooks/embeds.py.
use_directory_urls: false

hooks:
  - hooks/embeds.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/embeds.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Course:
      - "00 — Foundations": sessions/00_foundations.md
      - "01 — Naive Decoding": sessions/01_naive_decoding.md
      - "02 — KV Cache Memory Math": sessions/02_kv_cache_memory_math.md
      - "03 — MHA Recap": sessions/03_mha_recap.md
      - "04 — MQA": sessions/04_mqa.md
      - "05 — GQA": sessions/05_gqa.md
      - "06 — MLA": sessions/06_mla.md
      - "07 — RoPE": sessions/07_rope.md
      - "08 — FlashAttention": sessions/08_flashattention.md
      - "09 — PyTorch SDPA": sessions/09_pytorch_sdpa.md
      - "10 — PagedAttention / vLLM": sessions/10_pagedattention_vllm.md
  - Beyond the course:
      - "Attention variants compared": beyond/variants_compared.md
      - "KV cache SOTA map": beyond/sota_map.md
      - "Inference problems": beyond/inference_problems.md
      - "Serving stack & scheduler": beyond/serving.md
  - Study notes:
      - "Deep-dive explanation": study/explanation.md
      - "Interview questions": study/interview_questions.md
  - Gallery: gallery.md
